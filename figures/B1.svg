<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Was Sie sehen – und was das Modell liest</title><desc id='d'>Links ein Kundenbrief, wie er am Bildschirm erscheint; ein Bereich ist leer, weil dort weißer Text auf weißem Grund steht. Rechts derselbe Brief als Textauszug für den KI-Assistenten; der versteckte Satz ist sichtbar und fordert, Lieferung am Freitag und zehn Prozent Nachlass zuzusagen.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Was Sie sehen – und was das Modell liest</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Derselbe Kundenbrief: links am Bildschirm, rechts als Text, den der KI-Assistent bekommt.</text><rect x='48' y='140' width='250' height='38' rx='19.0' fill='#00366D' stroke='#00366D' stroke-width='0' /><text x='173.0' y='165.84' font-size='19' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Was Sie sehen</text><rect x='48' y='190' width='640' height='560' rx='10' fill='#fff' stroke='#CDD3DD' stroke-width='2.5' /><text x='84' y='240' font-size='24' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Büro Nordlicht GmbH</text><text x='84' y='270' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Musterweg 12 · 99999 Beispielstadt</text><text x='84' y='318' font-size='20' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Betreff: Bestellung 20 Schreibtischleuchten Luma</text><text x='84' y='362.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Sehr geehrte Damen und Herren, unsere 20</text><text x='84' y='391.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Schreibtischleuchten sind nicht angekommen. Die</text><text x='84' y='420.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Lieferung war für Dienstag angekündigt. Wann können</text><text x='84' y='449.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >wir damit rechnen?</text><rect x='72' y='470' width='592' height='112' rx='8' fill='#fff' stroke='#CDD3DD' stroke-width='2' stroke-dasharray='6 6'/><text x='368' y='532' font-size='18' fill='#8B97AB' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >(weiß auf weiß – für Menschen unsichtbar)</text><text x='84' y='640' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Mit freundlichen Grüßen</text><text x='84' y='670' font-size='20' fill='#0A1220' font-weight='400' tex