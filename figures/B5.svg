<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Manipulation ohne Datenabfluss</title><desc id='d'>Ablauf in fünf Schritten: Eine Kundenmail mit verstecktem Hinweis geht an den KI-Assistenten. Er entwirft eine Antwort mit der falschen Zusage Lieferung Freitag und zehn Prozent Nachlass. Der Mitarbeiter klickt auf Senden, der Kunde erhält eine nicht freigegebene Zusage. Nur Ecke 2 des Dreiecks ist aktiv, es fließen keine Daten ab, der Schaden entsteht trotzdem. Die Stoppstelle ist die Prüfung des Entwurfs vor dem Senden.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Manipulation ohne Datenabfluss: die falsche Zusage</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Nur eine Ecke ist aktiv. Es fließen keine Daten ab – und trotzdem entsteht ein Schaden.</text><rect x='44' y='160' width='264' height='190' rx='14' fill='#FBEDEA' stroke='#C42E18' stroke-width='2.5' /><circle cx='176' cy='160' r='20' fill='#C42E18'/><text x='176' y='167.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='176' y='222' font-size='26' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Kundenmail</text><text x='176' y='268.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >mit verstecktem</text><text x='176' y='295.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Hinweis</text><line x1='310' y1='255' x2='348' y2='255' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><rect x='356' y='160' width='264' height='190' rx='14' fill='#fff' stroke='#00366D' stroke-width='2.5' /><circle cx='488' cy='160' r='20' fill='#00366D'/><text x='488' y='167.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><text x='488' y='222' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >KI-Assistent</text><text x='488' y='268.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >entwirft eine</text><text x='488' y='295.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Antwort</text><line x1='622' y1='255' x2='660' y2='255' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><rect x='668' y='160' width='264' height='190' rx='14' fill='#FBEDEA' stroke='#C42E18' stroke-width='2.5' /><circle cx='800' cy='160' r='20' fill='#C42E18'/><text x='800' y='167.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='800' y='222' font-size='26' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Entwurf</text><text x='800' y='268.0' font-size='20' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >„Lieferung Freitag,</text><text x='800' y='295.0' font-size='20' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >zehn Prozent Nachlass“</text><line x1='934' y1='255' x2='972' y2='255' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><rect x='980' y='160' width='264' height='190' rx='14' fill='#F1F4F9' stroke='#00366D' stroke-width='4' /><circle cx='1112' cy='160' r='20' fill='#00366D'/><text x='1112' y='167.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >4</text><text x='1112' y='222' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Mitarbeiter</text><text x='1112' y='268.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >prüft und klickt</text><text x='1112' y='295.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >„Senden“</text><line x1='1246' y1='255' x2='1284' y2='255' stroke='#00366D' stroke-width='4' marker-end='url(#ah00366D)' /><rect x='1292' y='160' width='264' height='190' rx='14' fill='#fff' stroke='#00366D' stroke-width='2.5' /><circle cx='1424' cy='160' r='20' fill='#00366D'/><text x='1424' y='167.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >5</text><text x='1424' y='222' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Kunde</text><text x='1424' y='268.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >erhält eine Zusage,</text><text x='1424' y='295.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >die niemand freigab</text><rect x='222' y='136' width='84' height='28' rx='14.0' fill='#C42E18' stroke='#C42E18' stroke-width='0' /><text x='264.0' y='155.76' font-size='16' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 2</text><line x1='1112' y1='352' x2='1112' y2='402' stroke='#00366D' stroke-width='4'/><rect x='812' y='402' width='600' height='104' rx='14' fill='#fff' stroke='#00366D' stroke-width='3' /><text x='836' y='442' font-size='22' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Hier stoppen:</text><text x='836' y='474.0' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Entwurf gegen den Sachverhalt prüfen – Termin und</text><text x='836' y='498.7' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Nachlass sind nicht freigegeben.</text><line x1='200' y1='560' x2='113.0' y2='710' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='113.0' y1='710' x2='287.0' y2='710' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='287.0' y1='710' x2='200' y2='560' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><circle cx='200' cy='560' r='22' fill='#8B97AB'/><text x='200' y='567.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><circle cx='113.0' cy='710' r='22' fill='#C42E18'/><text x='113.0' y='717.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><circle cx='287.0' cy='710' r='22' fill='#8B97AB'/><text x='287.0' y='717.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='360' y='600' font-size='22' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ecke 1 und 3 fehlen: Es gibt keinen Weg, Daten hinauszutragen.</text><text x='360' y='640' font-size='22' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ecke 2 genügt für eine Zusage im Namen der Firma, die niemand freigegeben hat.</text><text x='360' y='680' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Haftung, Kosten, Vertrauen: Der Schaden entsteht durch den Klick, nicht durch das Modell allein.</text><rect x='48' y='784' width='1504' height='96' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='800.0' y='824' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Manipulation braucht keinen Datenabfluss.</text><text x='800.0' y='860' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Deshalb gilt: Entwürfe aus fremden Inhalten prüfen, bevor sie das Haus verlassen.</text></svg>