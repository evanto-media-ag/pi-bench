<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id='t'>The lethal trifecta</title><desc id='d'>A triangle with three corners: 1 access to private data, 2 processes untrusted content, 3 can communicate externally. When all three meet in one tool, data exfiltration is possible – regardless of whether the model runs in a US cloud, with an EU provider or in your own data centre. The employee&#x27;s click is often the third corner.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >The lethal trifecta: three capabilities in one tool</text><path d='M800 236 L1220 650 L380 650 Z' fill='#F1F4F9' stroke='#00366D' stroke-width='5' stroke-linejoin='round'/><circle cx='800' cy='392' r='32' fill='#C42E18'/><text x='800' y='407' font-size='42' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >!</text><text x='800' y='466' font-size='24' fill='#0A1220' font-weight='600' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >All three corners together:</text><text x='800' y='510' font-size='36' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >data exfiltration possible</text><text x='800' y='572' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >no matter where the model runs:</text><text x='800' y='602' font-size='21' fill='#4A5A75' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >US cloud, EU provider or your own data centre</text><rect x='480' y='100' width='640' height='104' rx='14' fill='#fff' stroke='#00366D' stroke-width='3' /><circle cx='524' cy='152' r='26' fill='#00366D'/><text x='524' y='161.36' font-size='26' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='568' y='146' font-size='27' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Access to private data</text><text x='568' y='180' font-size='20' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >mailbox, file shares, customer data, contracts</text><rect x='48' y='690' width='600' height='104' rx='14' fill='#fff' stroke='#00366D' stroke-width='3' /><circle cx='92' cy='742' r='26' fill='#00366D'/><text x='92' y='751.36' font-size='26' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><text x='136' y='736' font-size='27' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Processes untrusted content</text><text x='136' y='770' font-size='20' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >incoming e-mails, attachments, web pages</text><rect x='952' y='690' width='600' height='104' rx='14' fill='#fff' stroke='#00366D' stroke-width='3' /><circle cx='996' cy='742' r='26' fill='#00366D'/><text x='996' y='751.36' font-size='26' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='1040' y='736' font-size='27' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Can communicate externally</text><text x='1040' y='770' font-size='20' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >e-mail, loading links and images, forms</text><g transform='translate(1380,270) scale(1.1)'><circle cx='20' cy='16' r='16' fill='#C42E18'/><path d='M0 90 V52 a20 20 0 0 1 40 0 V90z' fill='#C42E18'/></g><text x='1402' y='402' font-size='24' fill='#0A1220' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >You</text><text x='1402' y='450.0' font-size='26' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Your click is</text><text x='1402' y='482.5' font-size='26' fill='#C42E18' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >the third corner.</text><text x='1402' y='532' font-size='20' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Don&#x27;t approve the unexpected.</text><line x1='1402' y1='552' x2='1330' y2='676' stroke='#C42E18' stroke-width='4' marker-end='url(#ahC42E18)' /><text x='48' y='862' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Remove one corner and exfiltration stops – manipulation does not.  ·  Term coined by Simon Willison, 2025.</text></svg>