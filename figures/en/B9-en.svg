<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id='t'>Protection lives in the harness, not in the model</title><desc id='d'>Concentric layers around a replaceable model: 1 mark the input (spotlighting), 2 minimise data, 3 secure the output, 4 approval gate, 5 audit log. The legend maps each layer to a corner of the lethal trifecta.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Protection lives in the harness, not in the model</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >The model is replaceable. The layers around it decide how much damage an injected instruction can do.</text><circle cx='470' cy='500' r='352' fill='#CBD6E1' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='300' fill='#96ACC3' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='248' fill='#6888A9' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='196' fill='#436A93' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='144' fill='#255482' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='92' fill='#00366D' stroke='#fff' stroke-width='4'/><text x='470' y='496' font-size='28' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >model</text><text x='470' y='526' font-size='18' fill='#fff' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >replaceable</text><text x='470' y='390.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='470' y='338.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><text x='470' y='286.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='470' y='234.0' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >4</text><text x='470' y='182.0' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >5</text><rect x='900' y='146' width='26' height='92' rx='6' fill='#255482' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='168' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >1 · Mark the input</text><text x='944' y='200' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >mark untrusted content as data (spotlighting)</text><text x='944' y='228' font-size='19' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >acts on corner 2: lowers the risk, does not remove it</text><rect x='900' y='262' width='26' height='92' rx='6' fill='#436A93' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='284' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >2 · Minimise data</text><text x='944' y='316' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >least privilege, mask personal data</text><text x='944' y='344' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >closes corner 1 fully or partly</text><rect x='900' y='378' width='26' height='92' rx='6' fill='#6888A9' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='400' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >3 · Secure the output</text><text x='944' y='432' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >no external images, check links before opening</text><text x='944' y='460' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >closes corner 3 for images and links</text><rect x='900' y='494' width='26' height='92' rx='6' fill='#96ACC3' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='516' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >4 · Approval gate</text><text x='944' y='548' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >a human approves every outbound action</text><text x='944' y='576' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >closes corner 3 for tools</text><rect x='900' y='610' width='26' height='92' rx='6' fill='#CBD6E1' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='632' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >5 · Audit log</text><text x='944' y='664' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >requests, responses and actions traceable</text><text x='944' y='692' font-size='19' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >detects incidents, does not prevent them</text><rect x='900' y='762' width='652' height='104' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='924' y='802' font-size='21' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Disclosure – CompanyWizard, which I build, uses Presidio</text><text x='924' y='836' font-size='21' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >masking (layer 2) and an approval gate (layer 4).</text></svg>