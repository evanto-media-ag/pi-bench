<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Souverän ist nicht dasselbe wie sicher</title><desc id='d'>Eine Vier-Felder-Matrix. Waagerecht der Rechtsraum des Anbieters (US-Anbieter oder EU-Anbieter beziehungsweise eigener Betrieb), senkrecht der gemessene Widerstand gegen eingeschleuste Anweisungen. Frontier-Modelle in der US-Cloud erkennen Anweisungen oft, unterliegen aber möglicherweise einem Rechtszugriff aus einem Drittstaat. Offene Modelle bei EU-Anbietern oder im eigenen Rechenzentrum sind souverän, aber anfälliger; hier stehen viele EU-Firmen. Ein Pfeil zeigt: Erst das Harness mit Freigaben, Berechtigungen und ohne dritte Ecke führt in das Zielfeld souverän und abgesichert.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Souverän ist nicht dasselbe wie sicher</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Souveränität klärt, wer auf die Daten zugreifen darf. Gegen eingeschleuste Anweisungen hilft sie nicht.</text><rect x='250' y='150' width='600' height='280' rx='0' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><rect x='850' y='150' width='600' height='280' rx='0' fill='#F1F4F9' stroke='#00366D' stroke-width='3' stroke-dasharray='12 8'/><rect x='250' y='430' width='600' height='280' rx='0' fill='#fff' stroke='#CDD3DD' stroke-width='1.5' /><rect x='850' y='430' width='600' height='280' rx='0' fill='#FBEDEA' stroke='#FBEDEA' stroke-width='0' /><line x1='250' y1='710' x2='1480' y2='710' stroke='#0A1220' stroke-width='3' marker-end='url(#ah0A1220)' /><line x1='250' y1='710' x2='250' y2='130' stroke='#0A1220' stroke-width='3' marker-end='url(#ah0A1220)' /><text x='550' y='748' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >US-Anbieter, auch mit EU-Rechenzentrum</text><text x='1150' y='748' font-size='20' fill='#0A1220' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >EU-Anbieter oder eigener Betrieb</text><text x='850' y='790' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Rechtsraum des Anbieters¹</text><text x='150' y='430' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' transform='rotate(-90 150 430)'>Widerstand gegen eingeschleuste Anweisungen</text><text x='232' y='182' font-size='20' fill='#0A1220' font-weight='400' text-anchor='end' font-family='Pontano Sans, Arial, sans-serif' >hoch</text><text x='232' y='700' font-size='20' fill='#0A1220' font-weight='400' text-anchor='end' font-family='Pontano Sans, Arial, sans-serif' >niedrig</text><text x='280' y='200' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Frontier-Modelle in der US-Cloud</text><text x='280' y='240.0' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >erkennen eingeschleuste Anweisungen oft</text><text x='280' y='269.4' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Rechtszugriff aus Drittstaat möglich¹</text><text x='880' y='200' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ziel: souverän und abgesichert</text><text x='880' y='240.0' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Das Harness gleicht aus, was das Modell</text><text x='880' y='269.4' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >nicht erkennt: Freigaben, Berechtigungen,</text><text x='880' y='298.8' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >keine dritte Ecke.</text><circle cx='896' cy='372' r='9' fill='#00366D'/><text x='916' y='379' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >wenige europäische Frontier-Modelle</text><text x='280' y='480' font-size='25' fill='#4A5A75' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Kleine oder ältere Modelle, US-Cloud</text><text x='280' y='520' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Nachteile beider Welten</text><text x='880' y='480.0' font-size='25' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Offene Modelle bei EU-Anbietern</text><text x='880' y='511.25' font-size='25' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >oder im eigenen Rechenzentrum</text><text x='880' y='560' font-size='21' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >souverän, aber anfälliger</text><rect x='880' y='600' width='290' height='36' rx='18.0' fill='#C42E18' stroke='#C42E18' stroke-width='0' /><text x='1025.0' y='624.48' font-size='18' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Hier stehen viele EU-Firmen</text><path d='M1340 660 C1400 600 1400 420 1360 330' fill='none' stroke='#00366D' stroke-width='6' marker-end='url(#ah00366D)'/><text x='1410' y='520' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' transform='rotate(-90 1410 520)'>Harness</text><text x='48' y='840' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Positionen nach Modellgruppen der pi-bench-Messung vom 30.10.2026 (API-Zugriff, ohne Produkt-Harness), keine Bewertung einzelner Anbieter.</text><text x='48' y='870' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >¹ etwa über den US CLOUD Act. Die rechtliche Bewertung hängt vom Einzelfall ab und ist nicht Gegenstand dieser Grafik.</text></svg>