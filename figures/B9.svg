<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Der Schutz sitzt im Harness, nicht im Modell</title><desc id='d'>Konzentrische Schalen um ein austauschbares Modell: 1 Eingang kennzeichnen (Spotlighting), 2 Daten minimieren, 3 Ausgabe absichern, 4 Freigabe-Tor, 5 Protokoll. Die Legende ordnet jede Schale einer Ecke des tödlichen Dreiecks zu. Beispiel CompanyWizard: Presidio-Maskierung und Freigabe-Tor.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Der Schutz sitzt im Harness, nicht im Modell</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Das Modell ist austauschbar. Die Schalen drumherum entscheiden, was eine eingeschleuste Anweisung anrichten kann.</text><circle cx='470' cy='500' r='352' fill='#CBD6E1' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='300' fill='#96ACC3' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='248' fill='#6888A9' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='196' fill='#436A93' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='144' fill='#255482' stroke='#fff' stroke-width='4'/><circle cx='470' cy='500' r='92' fill='#00366D' stroke='#fff' stroke-width='4'/><text x='470' y='496' font-size='28' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Modell</text><text x='470' y='526' font-size='18' fill='#fff' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >austauschbar</text><text x='470' y='390.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='470' y='338.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><text x='470' y='286.0' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='470' y='234.0' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >4</text><text x='470' y='182.0' font-size='22' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >5</text><rect x='900' y='146' width='26' height='92' rx='6' fill='#255482' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='168' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >1 · Eingang kennzeichnen</text><text x='944' y='200' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >fremde Inhalte als Material markieren (Spotlighting)</text><text x='944' y='228' font-size='19' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >wirkt auf Ecke 2: senkt das Risiko, beseitigt es nicht</text><rect x='900' y='262' width='26' height='92' rx='6' fill='#436A93' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='284' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >2 · Daten minimieren</text><text x='944' y='316' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >nur nötige Berechtigungen, personenbezogene Daten maskieren</text><text x='944' y='344' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >schließt Ecke 1 ganz oder teilweise</text><rect x='900' y='378' width='26' height='92' rx='6' fill='#6888A9' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='400' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >3 · Ausgabe absichern</text><text x='944' y='432' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >keine externen Bilder, Links vor dem Öffnen prüfen</text><text x='944' y='460' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >schließt Ecke 3 für Bild und Link</text><rect x='900' y='494' width='26' height='92' rx='6' fill='#96ACC3' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='516' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >4 · Freigabe-Tor</text><text x='944' y='548' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >ein Mensch bestätigt jede Aktion nach außen</text><text x='944' y='576' font-size='19' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >schließt Ecke 3 für Werkzeuge</text><rect x='900' y='610' width='26' height='92' rx='6' fill='#CBD6E1' stroke='#CDD3DD' stroke-width='1.5'/><text x='944' y='632' font-size='25' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >5 · Protokoll</text><text x='944' y='664' font-size='19' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Anfragen, Antworten und Aktionen nachvollziehbar</text><text x='944' y='692' font-size='19' fill='#C42E18' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >erkennt Vorfälle, verhindert sie nicht</text><rect x='900' y='762' width='652' height='104' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='924' y='802' font-size='21' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Beispiel CompanyWizard: Presidio-Maskierung (Schale 2)</text><text x='924' y='836' font-size='21' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >und Freigabe-Tor vor Aktionen nach außen (Schale 4).</text></svg>