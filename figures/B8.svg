<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Eine Ecke entfernen</title><desc id='d'>Drei Spalten mit je einem kleinen Dreieck, bei dem eine Ecke durch ein Schloss ersetzt ist. Ecke 1 schließen: weniger Daten im Zugriff durch nötige Berechtigungen, Maskierung personenbezogener Daten und getrennte Assistenten; Aufwand mittel. Ecke 2 schließen: keine fremden Inhalte; im Kundenservice kaum machbar, Aufwand schwer. Ecke 3 schließen: kein Weg nach außen durch blockierte Bilder und Links, Freigabe vor dem Senden und keine Werkzeuge mit Außenwirkung; oft am einfachsten. Ohne eine Ecke kein Datenabfluss, Manipulation bleibt möglich.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Eine Ecke entfernen: drei Wege aus dem tödlichen Dreieck</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Es reicht, eine Ecke zu schließen. Welche, hängt vom Einsatz ab – die dritte ist meist am einfachsten.</text><rect x='48' y='140' width='480' height='610' rx='18' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><line x1='288.0' y1='190' x2='201.0' y2='340' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='201.0' y1='340' x2='375.0' y2='340' stroke='#00366D' stroke-width='5' /><line x1='375.0' y1='340' x2='288.0' y2='190' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><g transform='translate(288.0,190) scale(0.8)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><circle cx='201.0' cy='340' r='22' fill='#00366D'/><text x='201.0' y='347.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><circle cx='375.0' cy='340' r='22' fill='#00366D'/><text x='375.0' y='347.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='288.0' y='410' font-size='20' fill='#4A5A75' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 1 schließen</text><text x='288.0' y='446' font-size='27' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Weniger Daten im Zugriff</text><circle cx='88' cy='493' r='5' fill='#00366D'/><text x='106' y='500.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >nur nötige Berechtigungen</text><circle cx='88' cy='537' r='5' fill='#00366D'/><text x='106' y='544.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >personenbezogene Daten maskieren</text><text x='106' y='570.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >(z. B. Presidio)</text><circle cx='88' cy='607' r='5' fill='#00366D'/><text x='106' y='614.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >getrennte Assistenten je Aufgabe</text><rect x='78' y='692' width='420' height='38' rx='19.0' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='288.0' y='717.48' font-size='18' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Aufwand in der Praxis: mittel</text><rect x='560' y='140' width='480' height='610' rx='18' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><line x1='800.0' y1='190' x2='713.0' y2='340' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='713.0' y1='340' x2='887.0' y2='340' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='887.0' y1='340' x2='800.0' y2='190' stroke='#00366D' stroke-width='5' /><circle cx='800.0' cy='190' r='22' fill='#00366D'/><text x='800.0' y='197.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><g transform='translate(713.0,340) scale(0.8)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><circle cx='887.0' cy='340' r='22' fill='#00366D'/><text x='887.0' y='347.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='800.0' y='410' font-size='20' fill='#4A5A75' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 2 schließen</text><text x='800.0' y='446' font-size='27' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Keine fremden Inhalte</text><circle cx='600' cy='493' r='5' fill='#00366D'/><text x='618' y='500.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >nur geprüfte, interne Quellen</text><circle cx='600' cy='537' r='5' fill='#00366D'/><text x='618' y='544.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >keine Websuche und kein Postfach</text><text x='618' y='570.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >im selben Assistenten</text><circle cx='600' cy='607' r='5' fill='#00366D'/><text x='618' y='614.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >im Kundenservice kaum machbar</text><rect x='590' y='692' width='420' height='38' rx='19.0' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='800.0' y='717.48' font-size='18' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Aufwand in der Praxis: schwer</text><rect x='1072' y='140' width='480' height='610' rx='18' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><line x1='1312.0' y1='190' x2='1225.0' y2='340' stroke='#00366D' stroke-width='5' /><line x1='1225.0' y1='340' x2='1399.0' y2='340' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><line x1='1399.0' y1='340' x2='1312.0' y2='190' stroke='#CDD3DD' stroke-width='4' stroke-dasharray='8 7'/><circle cx='1312.0' cy='190' r='22' fill='#00366D'/><text x='1312.0' y='197.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><circle cx='1225.0' cy='340' r='22' fill='#00366D'/><text x='1225.0' y='347.92' font-size='22' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><g transform='translate(1399.0,340) scale(0.8)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><text x='1312.0' y='410' font-size='20' fill='#4A5A75' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ecke 3 schließen</text><text x='1312.0' y='446' font-size='27' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Kein Weg nach außen</text><circle cx='1112' cy='493' r='5' fill='#00366D'/><text x='1130' y='500.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >externe Bilder und Links</text><text x='1130' y='526.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >blockieren</text><circle cx='1112' cy='563' r='5' fill='#00366D'/><text x='1130' y='570.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Freigabe vor jedem Senden</text><circle cx='1112' cy='607' r='5' fill='#00366D'/><text x='1130' y='614.0' font-size='20' fill='#0A1220' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >keine Werkzeuge mit Außenwirkung</text><rect x='1102' y='692' width='420' height='38' rx='19.0' fill='#00366D' stroke='#00366D' stroke-width='0' /><text x='1312.0' y='717.48' font-size='18' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Aufwand in der Praxis: oft am einfachsten</text><rect x='48' y='784' width='1504' height='96' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='800.0' y='824' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Ohne eine Ecke kein Datenabfluss – Manipulation bleibt möglich.</text><text x='800.0' y='860' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Verwandt: Metas „Agents Rule of Two“ – höchstens zwei der drei Eigenschaften ohne menschliche Freigabe.</text></svg>