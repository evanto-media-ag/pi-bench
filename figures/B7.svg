<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'><title id='t'>Drei Wege nach draußen – drei Riegel</title><desc id='d'>Ein KI-Assistent mit Zugriff auf Firmendaten hat drei mögliche Ausgänge aus dem Unternehmen: 1 Bild laden, 2 Link klicken, 3 Werkzeug senden. Jeder Ausgang braucht einen eigenen Riegel: externe Bilder nicht laden, Links vor dem Öffnen prüfen, Freigabe vor jeder Aktion nach außen mit Empfänger-Positivliste.</desc><defs><marker id='ah00366D' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#00366D'/></marker><marker id='ahC42E18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#C42E18'/></marker><marker id='ah4A5A75' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4A5A75'/></marker><marker id='ah8B97AB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8B97AB'/></marker><marker id='ahfff' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#fff'/></marker></defs><rect width='1600' height='900' fill='#fff'/><text x='48' y='66' font-size='38' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Drei Wege nach draußen – drei Riegel</text><text x='48' y='108' font-size='22' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ecke 3 hat mehrere Türen. Welche es gibt und welche sich schließen lassen, entscheidet das Produkt.</text><text x='76' y='190' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ihr Unternehmen</text><rect x='84' y='330' width='380' height='230' rx='16' fill='#F1F4F9' stroke='#00366D' stroke-width='3' /><g transform='translate(110,370) scale(1.0)'><rect x='0' y='0' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='11' r='4' fill='#fff'/><rect x='26' y='8' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='26' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='37' r='4' fill='#fff'/><rect x='26' y='34' width='34' height='6' rx='3' fill='#fff' opacity='.6'/><rect x='0' y='52' width='70' height='22' rx='5' fill='#00366D'/><circle cx='12' cy='63' r='4' fill='#fff'/><rect x='26' y='60' width='34' height='6' rx='3' fill='#fff' opacity='.6'/></g><g transform='translate(370,368) scale(0.8)'><path d='M0 12 V60 a32 12 0 0 0 64 0 V12' fill='#00366D'/><ellipse cx='32' cy='12' rx='32' ry='12' fill='#436A93'/><path d='M0 36 a32 12 0 0 0 64 0' fill='none' stroke='#fff' stroke-width='3' opacity='.7'/></g><text x='110' y='486.0' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >KI-Assistent mit Zugriff</text><text x='110' y='514.8' font-size='24' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >auf Firmendaten</text><line x1='980' y1='160' x2='980' y2='222' stroke='#00366D' stroke-width='10' stroke-linecap='round'/><line x1='980' y1='302' x2='980' y2='422' stroke='#00366D' stroke-width='10' stroke-linecap='round'/><line x1='980' y1='502' x2='980' y2='622' stroke='#00366D' stroke-width='10' stroke-linecap='round'/><line x1='980' y1='702' x2='980' y2='762' stroke='#00366D' stroke-width='10' stroke-linecap='round'/><path d='M466 445 C700 445 760 262 936 262' fill='none' stroke='#C42E18' stroke-width='4' stroke-dasharray='10 8' marker-end='url(#ahC42E18)'/><g transform='translate(980,262) scale(1.0)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><rect x='1040' y='168' width='512' height='188' rx='14' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><circle cx='1076' cy='204' r='20' fill='#C42E18'/><text x='1076' y='211.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >1</text><text x='1108' y='212' font-size='25' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Bild laden</text><text x='1068' y='246.0' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Ein Markdown-Bild oder eine Vorschau lädt eine</text><text x='1068' y='269.4' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Adresse, in der Daten stecken.</text><line x1='1068' y1='290' x2='1524' y2='290' stroke='#F1F4F9' stroke-width='2'/><text x='1068' y='318.0' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Riegel: Externe Bilder nicht laden</text><text x='1068' y='341.4' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >(Content-Security-Policy)</text><path d='M466 445 C700 445 760 462 936 462' fill='none' stroke='#C42E18' stroke-width='4' stroke-dasharray='10 8' marker-end='url(#ahC42E18)'/><g transform='translate(980,462) scale(1.0)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><rect x='1040' y='368' width='512' height='188' rx='14' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><circle cx='1076' cy='404' r='20' fill='#C42E18'/><text x='1076' y='411.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >2</text><text x='1108' y='412' font-size='25' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Link klicken</text><text x='1068' y='446.0' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Daten stecken in einem Link, den jemand anklickt</text><text x='1068' y='469.4' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >oder ein Programm aufruft.</text><line x1='1068' y1='490' x2='1524' y2='490' stroke='#F1F4F9' stroke-width='2'/><text x='1068' y='518.0' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Riegel: Links vollständig anzeigen, Ziel vor</text><text x='1068' y='541.4' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >dem Öffnen prüfen</text><path d='M466 445 C700 445 760 662 936 662' fill='none' stroke='#C42E18' stroke-width='4' stroke-dasharray='10 8' marker-end='url(#ahC42E18)'/><g transform='translate(980,662) scale(1.0)'><circle cx='0' cy='0' r='34' fill='#fff' stroke='#00366D' stroke-width='4'/><path d='M-11 -2 V-10 a11 11 0 0 1 22 0 V-2' fill='none' stroke='#00366D' stroke-width='5'/><rect x='-16' y='-3' width='32' height='24' rx='5' fill='#00366D'/><circle cx='0' cy='8' r='3.5' fill='#fff'/></g><rect x='1040' y='568' width='512' height='188' rx='14' fill='#fff' stroke='#CDD3DD' stroke-width='2' /><circle cx='1076' cy='604' r='20' fill='#C42E18'/><text x='1076' y='611.2' font-size='20' fill='#fff' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >3</text><text x='1108' y='612' font-size='25' fill='#0A1220' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Werkzeug senden</text><text x='1068' y='646.0' font-size='18' fill='#4A5A75' font-weight='400' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >E-Mail, API-Aufruf, Formular oder geteilte Datei.</text><line x1='1068' y1='690' x2='1524' y2='690' stroke='#F1F4F9' stroke-width='2'/><text x='1068' y='718.0' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Riegel: Freigabe vor jeder Aktion nach außen,</text><text x='1068' y='741.4' font-size='18' fill='#00366D' font-weight='700' text-anchor='start' font-family='Pontano Sans, Arial, sans-serif' >Empfänger-Positivliste</text><rect x='48' y='784' width='1504' height='96' rx='14' fill='#F1F4F9' stroke='#F1F4F9' stroke-width='0' /><text x='800.0' y='824' font-size='26' fill='#00366D' font-weight='700' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Jede Tür braucht ihren eigenen Riegel. Ein offener Ausgang genügt für den Abfluss.</text><text x='800.0' y='860' font-size='21' fill='#4A5A75' font-weight='400' text-anchor='middle' font-family='Pontano Sans, Arial, sans-serif' >Fragen Sie beim Anbieter nach allen drei – nicht nur nach dem E-Mail-Werkzeug.</text></svg>